server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS - resolves `backend` per-request instead of
    # once at boot, so a plain `proxy_pass http://backend:.../` doesn't
    # crash-loop this whole container ("host not found in upstream") just
    # because the backend container is briefly down/restarting.
    resolver 127.0.0.11 valid=10s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/javascript 
               application/xml+rss;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Proxy API calls to the backend, same as the top-level reverse proxy
    # (nginx.conf at the repo root). Without this, hitting this container's
    # port directly (e.g. localhost:3000, bypassing the reverse proxy)
    # would fall through to the SPA fallback below and silently return
    # index.html - status 200, wrong content - for every /api/* call.
    location /api/ {
        # No path after the variable - see nginx.conf at the repo root for
        # why: proxy_pass with a variable doesn't rewrite the location
        # prefix, so a trailing `/api/` here would replace the request's
        # actual path instead of routing to it.
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive files
    location ~ /\. {
        return 404;
    }
}