name: Deploy to AWS

# Builds the backend/frontend Dockerfiles, pushes them to the ECR repos
# created by infra/aws/cloudformation-stack.yml, then rolls the ECS
# services over to the new images. Auth is via GitHub's OIDC provider
# assuming the GitHubActionsDeployRole from that same stack - no AWS
# access keys stored as repo secrets.
#
# One-time setup:
#   1. Deploy infra/aws/cloudformation-stack.yml.
#   2. Copy its GitHubActionsDeployRoleArn output into this repo's
#      Settings > Secrets and variables > Actions > Variables as
#      AWS_DEPLOY_ROLE_ARN.

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-aws.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-aws.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ENVIRONMENT_NAME: flash-sale-prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  test-server:
    name: Test (server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flash_sale_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run --workspace=@flash-sale/server lint

      - name: Type-check
        run: npm run --workspace=@flash-sale/server type-check

      - name: Unit + integration tests
        run: npm run --workspace=@flash-sale/server test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flash_sale_db
          REDIS_URL: redis://localhost:6379

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run --workspace=@flash-sale/frontend type-check

      - name: Tests
        run: npm run --workspace=@flash-sale/frontend test

  build-and-push:
    name: Build & push (${{ matrix.service }})
    needs: [test-server, test-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: packages/server/Dockerfile
          - service: frontend
            dockerfile: packages/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ env.ENVIRONMENT_NAME }}-${{ matrix.service }}
        run: |
          docker buildx build \
            --file "${{ matrix.dockerfile }}" \
            --tag "$ECR_REGISTRY/$REPOSITORY:${{ github.sha }}" \
            --tag "$ECR_REGISTRY/$REPOSITORY:latest" \
            --cache-from "type=registry,ref=$ECR_REGISTRY/$REPOSITORY:latest" \
            --cache-to "type=inline" \
            --push \
            .

  deploy:
    name: Deploy to ECS (${{ matrix.service }})
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      # max-parallel: 1 so the ALB always has at least one of the two
      # services fully stable instead of both mid-rollout at once.
      max-parallel: 1
      matrix:
        include:
          - service: backend
            container: backend
          - service: frontend
            container: frontend
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch current task definition
        env:
          FAMILY: ${{ env.ENVIRONMENT_NAME }}-${{ matrix.service }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition \
            > task-def-raw.json

          # register-task-definition rejects the read-only fields that
          # describe-task-definition includes in its output.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def-raw.json > task-def.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ENVIRONMENT_NAME }}-${{ matrix.service }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ENVIRONMENT_NAME }}-${{ matrix.service }}
          cluster: ${{ env.ENVIRONMENT_NAME }}-cluster
          wait-for-service-stability: true
