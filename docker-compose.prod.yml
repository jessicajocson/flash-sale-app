name: flash-sale-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-sale-prod-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flash_sale_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flash-sale-prod-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flash-sale-prod-redis
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flash-sale-prod-network
    restart: unless-stopped

  # BACKEND SERVICE
  # Schema init runs from the app itself on boot, so no initdb.d mount needed.
  backend:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: flash-sale-prod-backend
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flash_sale_dev
      DATABASE_POOL_SIZE: 10
      DATABASE_IDLE_TIMEOUT: 30000
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
      # Placeholder only - config/flash-sale.config.ts refuses to boot in
      # production with the dev-default key, so this can't be that value.
      # Override for any real deployment.
      ADMIN_KEY: local-prod-stack-admin-key-change-me
      STOCK: 100
      # SALE_START / SALE_END unset -> starts 1 min after boot, runs 5 min.
      # Set ISO 8601 UTC values here for a real launch window.
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flash-sale-prod-network
    restart: unless-stopped

  # FRONTEND SERVICE
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    container_name: flash-sale-prod-frontend
    ports:
      - "3000:80"
    networks:
      - flash-sale-prod-network
    restart: unless-stopped

  # NGIX PROXY
  nginx:
    image: nginx:alpine
    container_name: flash-sale-prod-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - flash-sale-prod-network
    restart: unless-stopped

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

networks:
  flash-sale-prod-network:
    driver: bridge
