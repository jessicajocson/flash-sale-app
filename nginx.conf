# Reverse proxy - routes by path so the browser only talks to one origin.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS - resolves upstreams per-request instead of once at boot
    resolver 127.0.0.11 valid=10s;

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Bare proxy_pass, no trailing path - keeps the URI as-is
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~ /\. {
        return 404;
    }
}
