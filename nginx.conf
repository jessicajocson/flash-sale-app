# Public reverse proxy in front of the `frontend` and `backend` containers
# (see docker-compose.prod.yml). The frontend serves its own static build
# via its own nginx (packages/frontend/nginx.conf) - this nginx just routes
# by path so the browser only ever talks to one origin.
server {
    listen 80;
    server_name _;

    # Docker's embedded DNS - resolves `backend`/`frontend` per-request
    # instead of once at boot. Without this, a `proxy_pass` to a plain
    # hostname is resolved a single time when nginx starts; if that
    # container isn't up yet (or restarts later and briefly isn't
    # resolvable), nginx refuses to start at all ("host not found in
    # upstream") instead of just failing the individual request.
    resolver 127.0.0.11 valid=10s;

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # No path after the variable: proxy_pass with a variable doesn't
        # do the usual location-prefix rewrite, so a trailing `/api/` here
        # would REPLACE the request's actual path instead of just routing
        # to it - every request would hit literally "/api/" on the
        # backend. Passing it bare forwards the original URI unchanged
        # (which is already correct, since it's already `/api/v1/...`).
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~ /\. {
        return 404;
    }
}
